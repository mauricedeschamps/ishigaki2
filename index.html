<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yaeyama & Miyako Islands Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="icons/icon-192.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body {
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }
    :root {
      --bg-primary: #0b1120;
      --bg-secondary: #1e293b;
      --bg-card: #111827;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e6;
      --border: #334155;
      --accent: #3b82f6;
      --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    body.light {
      --bg-primary: #f8fafc;
      --bg-secondary: #e2e8f0;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --border: #cbd5e1;
      --accent: #2563eb;
      --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }
    header {
      padding: 1.5rem 0 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .controls {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    select, .theme-toggle {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .island-card {
      background: var(--bg-card);
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .island-card:hover { transform: translateY(-4px); }
    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .card-content { padding: 1.5rem; }
    .card-title { font-size: 1.8rem; margin-bottom: 0.75rem; }
    .map-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 1rem;
      margin: 1rem 0;
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 0.6rem 1.4rem;
      border-radius: 2rem;
      text-decoration: none;
      font-weight: 500;
      margin-top: 0.75rem;
      margin-right: 0.8rem;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .surrounding-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .mini-card {
      background: var(--bg-card);
      border-radius: 1rem;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .mini-card:active { transform: scale(0.98); }
    .mini-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .mini-content { padding: 1rem; }
    .detail-container {
      background: var(--bg-card);
      border-radius: 2rem;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .detail-img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .info-block { margin: 1.5rem 0; }
    .info-block h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    footer {
      margin-top: 3rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
    .sponsor-area {
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 0.8rem;
      text-align: center;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .sponsor-img { height: 40px; object-fit: contain; }
    .back-bar { margin-bottom: 1.5rem; }
    .hidden { display: none; }
    @media (max-width: 640px) { .map-img { height: 200px; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="mainTitle">Yaeyama & Miyako Islands Guide</h1>
    <div class="controls">
      <select id="languageSelect">
        <option value="en">🇬🇧 English</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ja">🇯🇵 日本語</option>
      </select>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <main id="mainPage">
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <div id="surroundingPage" class="hidden">
    <div class="back-bar"><button class="btn" id="backToMainBtn">← Back to Main Islands</button></div>
    <h2 id="surroundingTitle"></h2>
    <div class="surrounding-grid" id="surroundingGrid"></div>
  </div>

  <div id="detailPage" class="hidden">
    <div class="detail-container" id="detailContainer"></div>
    <div class="back-bar"><button class="btn" id="backToListBtn">← Back to Surrounding Islands</button></div>
  </div>

  <footer>
    <p>Contact us: <a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a></p>
    <div class="sponsor-area">
      <span>✨ Supported by</span>
      <a href="https://www.euglena.jp/" target="_blank"><img class="sponsor-img" src="https://www.euglena.jp/wp_01/wp-content/uploads/2023/10/efd456796c829c131a17e6e6526cbc82.png" alt="Euglena"></a>
    </div>
  </footer>
</div>

    hatoma: { id:"hatoma", name:{en:"Hatoma",it:"Hatoma",ru:"Хатома",ja:"鳩間島"}, mainImage:"https://images.pexels.com/photos/1618606/pexels-photo-1618606.jpeg?w=800&h=450&fit=crop", officialLink:"https://visitokinawa.jp/", desc:{en:"Tiny remote island",it:"Piccola isola remota",ru:"Маленький отдаленный остров",ja:"小さなへき地の島"}, access:{en:"Ferry from Ishigaki/Iriomote",it:"Traghetto",ru:"Паром",ja:"フェリー"}, sights:{en:"Hatoma Beach, Nakamoto",it:"Spiaggia Hatoma, villaggio",ru:"Пляж Хатома, деревня",ja:"鳩間ビーチ"}, tips:{en:"Bring supplies",it:"Porta rifornimenti",ru:"Имейте запасы",ja:"食料持参"} },
    // 宮古周辺4島
    irabu: { id:"irabu", name:{en:"Irabu",it:"Irabu",ru:"Ирабу",ja:"伊良部島"}, mainImage:"https://images.pexels.com/photos/1283819/pexels-photo-1283819.jpeg?w=800&h=450&fit=crop", officialLink:"https://www.miyakotravel.jp/", desc:{en:"Irabu bridge, cliffs",it:"Ponte, scogliere",ru:"Мост, скалы",ja:"伊良部大橋、絶壁"}, access:{en:"Drive across Irabu Bridge",it:"Ponte in auto",ru:"Автомобильный мост",ja:"車で伊良部大橋"}, sights:{en:"Toriike Pond, Sawada Beach",it:"Stagno Toriike, spiaggia Sawada",ru:"Пруд Ториикэ, пляж Савада",ja:"通り池、佐和田ビーチ"}, tips:{en:"Explore at low tide",it:"Esplora con bassa marea",ru:"Исследуйте в отлив",ja:"干潮時に探検"} },

    ikema: { id:"ikema", name:{en:"Ikema",it:"Ikema",ru:"Икема",ja:"池間島"}, mainImage:"https://images.pexels.com/photos/189349/pexels-photo-189349.jpeg?w=800&h=450&fit=crop", officialLink:"https://www.miyakotravel.jp/", desc:{en:"Ikema bridge, pristine beaches",it:"Ponte, spiagge incontaminate",ru:"Мост, нетронутые пляжи",ja:"池間大橋、手つかずのビーチ"}, access:{en:"Ikema Bridge from Miyako",it:"Ponte Ikema",ru:"Мост Икема",ja:"池間大橋"}, sights:{en:"Bridge view, Funakusu Beach",it:"Vista ponte, spiaggia Funakusu",ru:"Вид на мост, пляж Фунакусу",ja:"橋の眺め、フナクス浜"}, tips:{en:"Sunset spectacular",it:"Tramonto spettacolare",ru:"Закат впечатляет",ja:"夕日が絶景"} },

  const UI_TEXT = {
    en: { backToMain: "← Back to Main Islands", backToList: "← Back to Surrounding Islands", viewSurrounding: "View Surrounding Islands", viewDetails: "View Details", officialSite: "Official Site", description: "Description", access: "Access", sights: "Sights", tips: "Travel Tips" },

    ru: { backToMain: "← На главные острова", backToList: "← К окружающим островам", viewSurrounding: "Посмотреть окружающие острова", viewDetails: "Подробнее", officialSite: "Официальный сайт", description: "Описание", access: "Транспорт", sights: "Достопримечательности", tips: "Советы" },
    ja: { backToMain: "← メイン島一覧へ戻る", backToList: "← 周辺島一覧へ戻る", viewSurrounding: "周辺島を見る", viewDetails: "詳細を見る", officialSite: "公式サイト", description: "説明", access: "アクセス", sights: "見どころ", tips: "旅のヒント" }

  const surroundingMap = {
    ishigaki: ['iriomote', 'taketomi', 'kohama', 'kuro', 'hatoma'],
    miyako: ['irabu', 'shimoji', 'ikema', 'kurima']
  };

  let currentLang = "en";
  let currentTheme = "dark";
  let currentView = "main"; // 'main', 'surrounding', 'detail'
  let currentMainId = null;
  let currentIslandId = null;

  // DOM elements
  const mainPageDiv = document.getElementById('mainPage');
  const surroundingPageDiv = document.getElementById('surroundingPage');
  const detailPageDiv = document.getElementById('detailPage');
  const cardsGrid = document.getElementById('cardsGrid');
  const surroundingGrid = document.getElementById('surroundingGrid');
  const surroundingTitle = document.getElementById('surroundingTitle');
  const detailContainer = document.getElementById('detailContainer');
  const backToMainBtn = document.getElementById('backToMainBtn');
  const backToListBtn = document.getElementById('backToListBtn');
  const languageSelect = document.getElementById('languageSelect');
  const themeToggle = document.getElementById('themeToggle');
  const mainTitle = document.getElementById('mainTitle');

  function t(key, islandId, field) {
    if (islandId && field && islandsData[islandId]?.[field]?.[currentLang]) return islandsData[islandId][field][currentLang];
    return UI_TEXT[currentLang]?.[key] || key;
  }

  function updateThemeUI() {
    document.body.classList.toggle('light', currentTheme === 'light');
    themeToggle.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  }

  function renderMainPage() {
    currentView = "main";
    mainPageDiv.classList.remove('hidden');
    surroundingPageDiv.classList.add('hidden');
    detailPageDiv.classList.add('hidden');
    const ui = UI_TEXT[currentLang];
    cardsGrid.innerHTML = ['ishigaki', 'miyako'].map(id => {
      const d = islandsData[id];
      const name = d.name[currentLang] || d.name.en;
      const desc = d.desc[currentLang] || d.desc.en;
      return `<div class="island-card">
        <img class="card-img" src="${d.mainImage}" loading="lazy">
        <div class="card-content">
          <h2 class="card-title">${name}</h2>
          <p>${desc}</p>
          <img class="map-img" src="${d.mapImage}" loading="lazy">
          <a href="${d.officialLink}" target="_blank" class="btn">${ui.officialSite} ↗</a>
          <button class="btn btn-outline surrounding-btn" data-main-id="${id}">${ui.viewSurrounding}</button>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.surrounding-btn').forEach(btn => {
      btn.addEventListener('click', () => showSurroundingPage(btn.dataset.mainId));
    });
  }

  function showSurroundingPage(mainId) {
    currentMainId = mainId;
    currentView = "surrounding";
    mainPageDiv.classList.add('hidden');
    surroundingPageDiv.classList.remove('hidden');
    detailPageDiv.classList.add('hidden');
    const mainName = islandsData[mainId].name[currentLang] || islandsData[mainId].name.en;
    surroundingTitle.textContent = `${mainName} - ${currentLang === 'ja' ? '周辺諸島' : (currentLang === 'en' ? 'Surrounding Islands' : (currentLang === 'ru' ? 'Окружающие острова' : 'Isole Circostanti'))}`;
    const ids = surroundingMap[mainId];
    surroundingGrid.innerHTML = ids.map(id => {
      const d = islandsData[id];
      const name = d.name[currentLang] || d.name.en;
      return `<div class="mini-card" data-id="${id}">
        <img class="mini-img" src="${d.mainImage}" loading="lazy">
        <div class="mini-content">
          <h3>${name}</h3>
          <button class="btn detail-from-surr-btn" data-id="${id}">${UI_TEXT[currentLang].viewDetails}</button>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.detail-from-surr-btn').forEach(btn => {
      btn.addEventListener('click', () => showDetailPage(btn.dataset.id));
    });
  }

  function showDetailPage(islandId) {
    currentIslandId = islandId;
    currentView = "detail";
    mainPageDiv.classList.add('hidden');
    surroundingPageDiv.classList.add('hidden');
    detailPageDiv.classList.remove('hidden');
    const d = islandsData[islandId];
    const ui = UI_TEXT[currentLang];
    const name = d.name[currentLang] || d.name.en;
    const description = d.desc[currentLang] || d.desc.en;
    const access = d.access[currentLang] || d.access.en;
    const sights = d.sights[currentLang] || d.sights.en;
    const tips = d.tips[currentLang] || d.tips.en;
    detailContainer.innerHTML = `
      <img class="detail-img" src="${d.mainImage}" alt="${name}">
      <h2>${name}</h2>
      <div class="info-block"><h3>📖 ${ui.description}</h3><p>${description}</p></div>
      <div class="info-block"><h3>🚢 ${ui.access}</h3><p>${access}</p></div>
      <div class="info-block"><h3>✨ ${ui.sights}</h3><p>${sights}</p></div>
      <div class="info-block"><h3>💡 ${ui.tips}</h3><p>${tips}</p></div>
      <a href="${d.officialLink}" target="_blank" class="btn">${ui.officialSite} ↗</a>
    `;
  }

  function switchLanguage(lang) {
    currentLang = lang;
    const titles = { en: "Yaeyama & Miyako Islands Guide", it: "Guida Isole Yaeyama e Miyako", ru: "Путеводитель по островам Яэяма и Мияко", ja: "八重山・宮古諸島ガイド" };
    mainTitle.textContent = titles[currentLang];
    if (currentView === "main") renderMainPage();
    else if (currentView === "surrounding") showSurroundingPage(currentMainId);
    else if (currentView === "detail") showDetailPage(currentIslandId);
  }

  backToMainBtn.addEventListener('click', () => renderMainPage());
  backToListBtn.addEventListener('click', () => showSurroundingPage(currentMainId));

  languageSelect.addEventListener('change', e => {
    localStorage.setItem('appLang', e.target.value);
    switchLanguage(e.target.value);
  });
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('appTheme', currentTheme);
    updateThemeUI();
  });

  const savedLang = localStorage.getItem('appLang') || 'en';
  const savedTheme = localStorage.getItem('appTheme') || 'dark';
  currentLang = savedLang;
  currentTheme = savedTheme;
  languageSelect.value = currentLang;
  updateThemeUI();
  renderMainPage();

  // Service Worker 登録 (東京アプリと同じ確実な方法)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration error:', err));
    });
  }
</script>
</body>
</html>
