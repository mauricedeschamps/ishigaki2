            margin: 1rem 0;

            border-radius: 2rem;

            font-weight: 500;
            margin-top: 0.75rem;
            margin-right: 0.8rem;
            border: none;
            cursor: pointer;

            margin: 1.5rem 0;

            border-radius: 1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
        }
        .mini-img {
            width: 100%;
            height: 180px;

        }
        .mini-content { padding: 1rem; }
        .detail-container {
            background: var(--bg-card);
            border-radius: 2rem;
            padding: 2rem;
            margin-bottom: 2rem;

        .detail-img {
            width: 100%;

            border-radius: 1.5rem;
            margin-bottom: 1.5rem;

</head>

        return key;
    }

    function updateThemeUI() {
        document.body.classList.toggle('light', currentTheme === 'light');
        document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    // レンダリング関数
    function renderMainPage() {
        const ui = UI_TEXT[currentLang];
        const html = `
            <div class="cards-grid">
                ${renderMainCard('ishigaki', ui)}
                ${renderMainCard('miyako', ui)}
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        document.querySelectorAll('.surrounding-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mainId = btn.getAttribute('data-main-id');
                renderSurroundingPage(mainId);
            });
        });
        currentView = { type: 'main' };
    }

    function renderMainCard(id, ui) {
        const data = islandsData[id];
        const name = data.name[currentLang] || data.name.en;
        const desc = data.desc?.[currentLang] || data.desc.en;
        return `
            <div class="island-card">
                <img class="card-img" src="${data.mainImage}" alt="${name}" loading="lazy">
                <div class="card-content">
                    <h2 class="card-title">${name}</h2>
                    <p>${desc}</p>
                    <img class="map-img" src="${data.mapImage}" alt="map" loading="lazy">
                    <a href="${data.officialLink}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                    <button class="btn btn-outline surrounding-btn" data-main-id="${id}">${ui.viewSurrounding}</button>
                </div>
            </div>
        `;
    }

    function renderSurroundingPage(mainId) {
        const ui = UI_TEXT[currentLang];
        const mainName = islandsData[mainId].name[currentLang] || islandsData[mainId].name.en;
        const surroundingIds = surroundingMap[mainId];
        const cardsHtml = surroundingIds.map(id => {
            const data = islandsData[id];
            const name = data.name[currentLang] || data.name.en;
            const img = data.mainImage;
            return `
                <div class="mini-card" data-id="${id}">
                    <img class="mini-img" src="${img}" alt="${name}" loading="lazy">
                    <div class="mini-content">
                        <h3>${name}</h3>
                        <button class="btn detail-from-surr-btn" data-id="${id}">${ui.viewDetails}</button>
                    </div>
                </div>
            `;
        }).join('');
        const html = `
            <div class="back-bar">
                <button class="btn" id="backToMainBtn">${ui.backToMain}</button>
            </div>
            <h2>${mainName} - ${currentLang === 'ja' ? '周辺諸島' : (currentLang === 'en' ? 'Surrounding Islands' : 'Isole Circostanti')}</h2>
            <div class="surrounding-grid">${cardsHtml}</div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        document.getElementById('backToMainBtn').addEventListener('click', () => renderMainPage());
        document.querySelectorAll('.detail-from-surr-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const islandId = btn.getAttribute('data-id');
                renderDetailPage(islandId, mainId);
            });
        });
        currentView = { type: 'surrounding', parentId: mainId };
    }

    function renderDetailPage(islandId, returnToMainId = null) {
        const data = islandsData[islandId];
        if (!data) return;
        const ui = UI_TEXT[currentLang];
        const name = data.name[currentLang] || data.name.en;
        const description = data.desc?.[currentLang] || data.desc?.en || "";
        const access = data.access?.[currentLang] || data.access?.en || "";
        const sights = data.sights?.[currentLang] || data.sights?.en || "";
        const tips = data.tips?.[currentLang] || data.tips?.en || "";
        const official = data.officialLink;
        const img = data.mainImage;
        const backButton = returnToMainId 
            ? `<button class="btn" id="backToListBtn">${ui.backToList}</button>`
            : `<button class="btn" id="backDirectBtn">${ui.backToMain}</button>`;
        const html = `
            <div class="detail-container">
                <div class="back-bar">${backButton}</div>
                <img class="detail-img" src="${img}" alt="${name}">
                <div class="detail-info">
                    <h2>${name}</h2>
                    <div class="info-block"><h3>📖 ${ui.description}</h3><p>${description}</p></div>
                    <div class="info-block"><h3>🚢 ${ui.access}</h3><p>${access}</p></div>
                    <div class="info-block"><h3>✨ ${ui.sights}</h3><p>${sights}</p></div>
                    <div class="info-block"><h3>💡 ${ui.tips}</h3><p>${tips}</p></div>
                    <a href="${official}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                </div>
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        if (returnToMainId) {
            document.getElementById('backToListBtn').addEventListener('click', () => renderSurroundingPage(returnToMainId));
        } else {
            document.getElementById('backDirectBtn').addEventListener('click', () => renderMainPage());
        }
        currentView = { type: 'detail', islandId, returnToMainId };
    }

    function switchLanguage(lang) {
        currentLang = lang;
        const titles = { en: "Yaeyama & Miyako Islands Guide", it: "Guida Isole Yaeyama e Miyako", ru: "Путеводитель по островам Яэяма и Мияко", ja: "八重山・宮古諸島ガイド" };
        document.getElementById('mainTitle').innerHTML = titles[currentLang];
        if (currentView.type === 'main') renderMainPage();
        else if (currentView.type === 'surrounding') renderSurroundingPage(currentView.parentId);
        else if (currentView.type === 'detail') renderDetailPage(currentView.islandId, currentView.returnToMainId);
    }

    // PWA インストール処理
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('installBtn');
        installBtn.style.display = 'inline-block';
        installBtn.onclick = () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { installBtn.style.display = 'none'; deferredPrompt = null; });
            }
        };
    });

    // 初期化
    function initApp() {
        const savedLang = localStorage.getItem('appLang') || 'en';
        const savedTheme = localStorage.getItem('appTheme') || 'dark';
        currentLang = savedLang;
        currentTheme = savedTheme;
        document.getElementById('languageSelect').value = currentLang;
        updateThemeUI();
        renderMainPage();
        document.getElementById('languageSelect').addEventListener('change', (e) => {
            localStorage.setItem('appLang', e.target.value);
            switchLanguage(e.target.value);
        });
        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('appTheme', currentTheme);
            updateThemeUI();
        });
    }
    initApp();

// Service Worker 登録（絶対パス推奨）
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW登録済み', reg)).catch(err => console.log('SWエラー', err));
    }

</script>
</body>
</html>
