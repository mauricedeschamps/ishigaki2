                en: "Small island connected by Ikema bridge, pristine beaches.",
                it: "Piccola isola collegata da ponte, spiagge incontaminate.",
                ru: "Небольшой остров, мост, нетронутые пляжи.",
                ja: "池間大橋で結ばれた小さな島。手つかずのビーチ。"
            },
            access: {
                en: "Ikema Bridge from Miyako mainland.",
                it: "Ponte Ikema.",
                ru: "Мост Икема.",
                ja: "宮古島から池間大橋を渡る。"
            },
            sights: {
                en: "Ikema Ohashi Bridge view, Funakusu Beach, windmills.",
                it: "Vista ponte, spiaggia Funakusu, mulini a vento.",
                ru: "Мост Икема, пляж Фунакусу, ветряки.",
                ja: "池間大橋の眺め、フナクス浜、風車。"
            },
            tips: {
                en: "Sunset at the bridge is spectacular.",
                it: "Tramonto spettacolare sul ponte.",
                ru: "Закат на мосту впечатляет.",
                ja: "橋からの夕日が絶景。"
            }
        },
        kurima: {
            id: "kurima",
            name: { en: "Kurima Island", it: "Kurima", ru: "Курима", ja: "来間島" },
            mainImage: "https://images.pexels.com/photos/2506927/pexels-photo-2506927.jpeg?w=800&h=450&fit=crop",
            officialLink: "https://www.miyakotravel.jp/",
            desc: {
                en: "Relaxed rural island, known for Kurima bridge view and wildflowers.",
                it: "Isole rurale, ponte Kurima e fiori selvatici.",
                ru: "Сельский остров с видом на мост Курима.",
                ja: "のどかな農村島。来間大橋の眺めと野草の花。"
            },
            access: {
                en: "Kurima Bridge from Miyako (about 5min drive).",
                it: "Ponte Kurima da Miyako.",
                ru: "Мост Курима.",
                ja: "宮古島から来間大橋（車で約5分）。"
            },
            sights: {
                en: "Nagamahama Beach, Ryugujo Observatory, pineapple fields.",
                it: "Spiaggia Nagamahama, osservatorio Ryugujo.",
                ru: "Пляж Нагамахама, обсерватория Рюгудзё.",
                ja: "長間浜、竜宮城展望台、パイナップル畑。"
            },
            tips: {
                en: "Quiet island, best for cycling.",
                it: "Isola tranquilla, ottima per bicicletta.",
                ru: "Тихий остров, хорошо для велосипеда.",
                ja: "静かな島。サイクリングに最適。"
            }
        }
    };

    // UI の多言語テキスト
    const UI_TEXT = {
        en: {
            backToMain: "← Back to Main Islands",
            backToList: "← Back to Surrounding Islands",
            viewSurrounding: "View Surrounding Islands",
            viewDetails: "View Details",
            officialSite: "Official Site",
            description: "Description",
            access: "Access",
            sights: "Sights",
            tips: "Travel Tips"
        },
        it: {
            backToMain: "← Torna alle Isole Principali",
            backToList: "← Torna alle Isole Circostanti",
            viewSurrounding: "Vedi Isole Circostanti",
            viewDetails: "Vedi Dettagli",
            officialSite: "Sito Ufficiale",
            description: "Descrizione",
            access: "Accesso",
            sights: "Attrazioni",
            tips: "Consigli di viaggio"
        },
        ru: {
            backToMain: "← На главные острова",
            backToList: "← К окружающим островам",
            viewSurrounding: "Посмотреть окружающие острова",
            viewDetails: "Подробнее",
            officialSite: "Официальный сайт",
            description: "Описание",
            access: "Транспорт",
            sights: "Достопримечательности",
            tips: "Советы туристам"
        },
        ja: {
            backToMain: "← メイン島一覧へ戻る",
            backToList: "← 周辺島一覧へ戻る",
            viewSurrounding: "周辺島を見る",
            viewDetails: "詳細を見る",
            officialSite: "公式サイト",
            description: "説明",
            access: "アクセス",
            sights: "見どころ",
            tips: "旅のヒント"
        }
    };

    const surroundingMap = {
        ishigaki: ['iriomote', 'taketomi', 'kohama', 'kuro', 'hatoma'],
        miyako: ['irabu', 'shimoji', 'ikema', 'kurima']
    };

    let currentLang = "en";
    let currentTheme = "dark";
    let currentView = { type: 'main' };

    // ヘルパー関数
    function t(key, islandId = null, field = null) {
        if (islandId && field && islandsData[islandId] && islandsData[islandId][field] && islandsData[islandId][field][currentLang]) {
            return islandsData[islandId][field][currentLang];
        }
        if (UI_TEXT[currentLang] && UI_TEXT[currentLang][key]) return UI_TEXT[currentLang][key];
        return key;
    }

    function updateThemeUI() {
        document.body.classList.toggle('light', currentTheme === 'light');
        document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    // メインページ描画
    function renderMainPage() {
        const ui = UI_TEXT[currentLang];
        const html = `
            <div class="cards-grid">
                ${renderMainCard('ishigaki', ui)}
                ${renderMainCard('miyako', ui)}
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        document.querySelectorAll('.surrounding-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mainId = btn.getAttribute('data-main-id');
                renderSurroundingPage(mainId);
            });
        });
        currentView = { type: 'main' };
    }

    function renderMainCard(id, ui) {
        const data = islandsData[id];
        const name = data.name[currentLang] || data.name.en;
        const desc = data.desc?.[currentLang] || data.desc.en;
        return `
            <div class="island-card">
                <img class="card-img" src="${data.mainImage}" alt="${name}" loading="lazy">
                <div class="card-content">
                    <h2 class="card-title">${name}</h2>
                    <p>${desc}</p>
                    <img class="map-img" src="${data.mapImage}" alt="map" loading="lazy">
                    <a href="${data.officialLink}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                    <button class="btn btn-outline surrounding-btn" data-main-id="${id}">${ui.viewSurrounding}</button>
                </div>
            </div>
        `;
    }

    // 周辺島一覧ページ
    function renderSurroundingPage(mainId) {
        const ui = UI_TEXT[currentLang];
        const mainName = islandsData[mainId].name[currentLang] || islandsData[mainId].name.en;
        const surroundingIds = surroundingMap[mainId];
        const cardsHtml = surroundingIds.map(id => {
            const data = islandsData[id];
            const name = data.name[currentLang] || data.name.en;
            const img = data.mainImage;
            return `
                <div class="mini-card" data-id="${id}">
                    <img class="mini-img" src="${img}" alt="${name}" loading="lazy">
                    <div class="mini-content">
                        <h3>${name}</h3>
                        <button class="btn detail-from-surr-btn" data-id="${id}">${ui.viewDetails}</button>
                    </div>
                </div>
            `;
        }).join('');
        const heading = currentLang === 'ja' ? '周辺諸島' : (currentLang === 'en' ? 'Surrounding Islands' : (currentLang === 'it' ? 'Isole Circostanti' : 'Окружающие острова'));
        const html = `
            <div class="back-bar">
                <button class="btn" id="backToMainBtn">${ui.backToMain}</button>
            </div>
            <h2>${mainName} - ${heading}</h2>
            <div class="surrounding-grid">${cardsHtml}</div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        document.getElementById('backToMainBtn').addEventListener('click', () => renderMainPage());
        document.querySelectorAll('.detail-from-surr-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const islandId = btn.getAttribute('data-id');
                renderDetailPage(islandId, mainId);
            });
        });
        currentView = { type: 'surrounding', parentId: mainId };
    }

    // 詳細ページ
    function renderDetailPage(islandId, returnToMainId = null) {
        const data = islandsData[islandId];
        if (!data) return;
        const ui = UI_TEXT[currentLang];
        const name = data.name[currentLang] || data.name.en;
        const description = data.desc?.[currentLang] || data.desc?.en || "";
        const access = data.access?.[currentLang] || data.access?.en || "";
        const sights = data.sights?.[currentLang] || data.sights?.en || "";
        const tips = data.tips?.[currentLang] || data.tips?.en || "";
        const official = data.officialLink;
        const img = data.mainImage;
        const backButton = returnToMainId 
            ? `<button class="btn" id="backToListBtn">${ui.backToList}</button>`
            : `<button class="btn" id="backDirectBtn">${ui.backToMain}</button>`;
        const html = `
            <div class="detail-container">
                <div class="back-bar">${backButton}</div>
                <img class="detail-img" src="${img}" alt="${name}">
                <div class="detail-info">
                    <h2>${name}</h2>
                    <div class="info-block"><h3>📖 ${ui.description}</h3><p>${description}</p></div>
                    <div class="info-block"><h3>🚢 ${ui.access}</h3><p>${access}</p></div>
                    <div class="info-block"><h3>✨ ${ui.sights}</h3><p>${sights}</p></div>
                    <div class="info-block"><h3>💡 ${ui.tips}</h3><p>${tips}</p></div>
                    <a href="${official}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                </div>
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        if (returnToMainId) {
            document.getElementById('backToListBtn').addEventListener('click', () => renderSurroundingPage(returnToMainId));
        } else {
            document.getElementById('backDirectBtn').addEventListener('click', () => renderMainPage());
        }
        currentView = { type: 'detail', islandId, returnToMainId };
    }

    // 言語切り替え
    function switchLanguage(lang) {
        currentLang = lang;
        const titles = {
            en: "Yaeyama & Miyako Islands Guide",
            it: "Guida Isole Yaeyama e Miyako",
            ru: "Путеводитель по островам Яэяма и Мияко",
            ja: "八重山・宮古諸島ガイド"
        };
        document.getElementById('mainTitle').innerHTML = titles[currentLang];
        if (currentView.type === 'main') renderMainPage();
        else if (currentView.type === 'surrounding') renderSurroundingPage(currentView.parentId);
        else if (currentView.type === 'detail') renderDetailPage(currentView.islandId, currentView.returnToMainId);
    }

    // 初期化
    function init() {
        const savedLang = localStorage.getItem('appLang') || 'en';
        const savedTheme = localStorage.getItem('appTheme') || 'dark';
        currentLang = savedLang;
        currentTheme = savedTheme;
        document.getElementById('languageSelect').value = currentLang;
        updateThemeUI();
        renderMainPage();
        document.getElementById('languageSelect').addEventListener('change', (e) => {
            localStorage.setItem('appLang', e.target.value);
            switchLanguage(e.target.value);
        });
        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('appTheme', currentTheme);
            updateThemeUI();
        });
    }
    init();

    // Service Worker 登録（相対パス）
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('Service Worker registered:', reg);
        }).catch(err => {
            console.log('Service Worker registration failed:', err);
        });
    }
</script>
</body>
</html>
