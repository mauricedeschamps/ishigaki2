            sights: { en: "Ikema Ohashi Bridge view, Funakusu Beach, windmills.", it: "Vista ponte, spiaggia Funakusu, mulini a vento.", ru: "Мост Икема, пляж Фунакусу, ветряки.", ja: "池間大橋の眺め、フナクス浜、風車。" },
            tips: { en: "Sunset at the bridge is spectacular.", it: "Tramonto spettacolare sul ponte.", ru: "Закат на мосту впечатляет.", ja: "橋からの夕日が絶景。" } },
        kurima: { id: "kurima", name: { en: "Kurima Island", it: "Kurima", ru: "Курима", ja: "来間島" }, mainImage: "https://images.pexels.com/photos/2506927/pexels-photo-2506927.jpeg?w=800&h=450&fit=crop", officialLink: "https://www.miyakotravel.jp/",
            desc: { en: "Relaxed rural island, known for Kurima bridge view and wildflowers.", it: "Isole rurale, ponte Kurima e fiori selvatici.", ru: "Сельский остров с видом на мост Курима.", ja: "のどかな農村島。来間大橋の眺めと野草の花。" },
            access: { en: "Kurima Bridge from Miyako (about 5min drive).", it: "Ponte Kurima da Miyako.", ru: "Мост Курима.", ja: "宮古島から来間大橋（車で約5分）。" },
            sights: { en: "Nagamahama Beach, Ryugujo Observatory, pineapple fields.", it: "Spiaggia Nagamahama, osservatorio Ryugujo.", ru: "Пляж Нагамахама, обсерватория Рюгудзё.", ja: "長間浜、竜宮城展望台、パイナップル畑。" },
            tips: { en: "Quiet island, best for cycling.", it: "Isola tranquilla, ottima per bicicletta.", ru: "Тихий остров, хорошо для велосипеда.", ja: "静かな島。サイクリングに最適。" } }
    };

    // UI の多言語テキスト
    const UI_TEXT = {
        en: { backToHome: "← Back to Main", viewDetails: "View Details", officialSite: "Official Site", description: "Description", access: "Access", sights: "Sights", tips: "Travel Tips", jumpYaeyama: "🏝️ Yaeyama Islands (Around Ishigaki)", jumpMiyako: "🏝️ Miyako Islands (Around Miyako)" },
        it: { backToHome: "← Torna alla Home", viewDetails: "Vedi dettagli", officialSite: "Sito Ufficiale", description: "Descrizione", access: "Accesso", sights: "Attrazioni", tips: "Consigli di viaggio", jumpYaeyama: "🏝️ Isole Yaeyama (Intorno a Ishigaki)", jumpMiyako: "🏝️ Isole Miyako (Intorno a Miyako)" },
        ru: { backToHome: "← На главную", viewDetails: "Подробнее", officialSite: "Официальный сайт", description: "Описание", access: "Транспорт", sights: "Достопримечательности", tips: "Советы туристам", jumpYaeyama: "🏝️ Острова Яэяма (вокруг Исигаки)", jumpMiyako: "🏝️ Острова Мияко (вокруг Мияко)" },
        ja: { backToHome: "← メインページへ戻る", viewDetails: "詳細を見る", officialSite: "公式サイト", description: "説明", access: "アクセス", sights: "見どころ", tips: "旅のヒント", jumpYaeyama: "🏝️ 八重山諸島 (石垣島周辺)", jumpMiyako: "🏝️ 宮古諸島 (宮古島周辺)" }
    };

    let currentLang = "en";
    let currentTheme = "dark";
    let currentView = "main";

    // 翻訳を取得するヘルパー
    function t(key, islandId = null, field = null) {
        if (islandId && field && islandsData[islandId] && islandsData[islandId][field] && islandsData[islandId][field][currentLang])
            return islandsData[islandId][field][currentLang];
        if (UI_TEXT[currentLang] && UI_TEXT[currentLang][key])
            return UI_TEXT[currentLang][key];
        return key;
    }

    function updateThemeUI() {
        document.body.classList.toggle('light', currentTheme === 'light');
        document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    function switchLanguage(lang) {
        currentLang = lang;
        if (currentView === 'main') renderMainPage();
        else if (currentView.startsWith('detail:')) {
            const islandId = currentView.split(':')[1];
            renderDetailPage(islandId);
        }
        const titles = { en: "Yaeyama & Miyako Islands Guide", it: "Guida Isole Yaeyama e Miyako", ru: "Путеводитель по островам Яэяма и Мияко", ja: "八重山・宮古諸島ガイド" };
        document.getElementById('mainTitle').innerHTML = titles[currentLang];
    }

    // メインページ描画
    function renderMainPage() {
        const ui = UI_TEXT[currentLang];
        const html = `
            <div class="cards-grid">
                ${renderMainCard('ishigaki', ui)}
                ${renderMainCard('miyako', ui)}
            </div>
            <div style="display: flex; gap: 1rem; margin: 1rem 0 2rem; flex-wrap:wrap;">
                <button class="btn" id="jumpYaeyamaBtn">${ui.jumpYaeyama}</button>
                <button class="btn" id="jumpMiyakoBtn">${ui.jumpMiyako}</button>
            </div>
            <div id="yaeyamaSection"><h2 class="section-title">✨ Yaeyama Islands (5 islands)</h2><div class="surrounding-grid" id="yaeyamaGrid"></div></div>
            <div id="miyakoSection"><h2 class="section-title">✨ Miyako Islands (4 islands)</h2><div class="surrounding-grid" id="miyakoGrid"></div></div>
        `;
        document.getElementById('dynamicContent').innerHTML = html;
        const yaeyamaIds = ['iriomote','taketomi','kohama','kuro','hatoma'];
        const miyakoIds = ['irabu','shimoji','ikema','kurima'];
        renderSurroundingGrid('yaeyamaGrid', yaeyamaIds);
        renderSurroundingGrid('miyakoGrid', miyakoIds);
        document.getElementById('jumpYaeyamaBtn').addEventListener('click', () => document.getElementById('yaeyamaSection').scrollIntoView({ behavior: 'smooth' }));
        document.getElementById('jumpMiyakoBtn').addEventListener('click', () => document.getElementById('miyakoSection').scrollIntoView({ behavior: 'smooth' }));
        attachCardDetailEvents();
        currentView = "main";
    }

    function renderMainCard(id, ui) {
        const data = islandsData[id];
        const name = data.name[currentLang] || data.name.en;
        const desc = data.desc?.[currentLang] || data.desc.en;
        return `<div class="island-card" data-id="${id}">
                    <img class="card-img" src="${data.mainImage}" alt="${name}" loading="lazy">
                    <div class="card-content">
                        <h2 class="card-title">${name}</h2>
                        <p>${desc}</p>
                        <img class="map-img" src="${data.mapImage}" alt="map">
                        <a href="${data.officialLink}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                        <button class="btn btn-outline detail-btn" data-id="${id}">${ui.viewDetails}</button>
                    </div>
                </div>`;
    }

    function renderSurroundingGrid(containerId, ids) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = ids.map(id => {
            const data = islandsData[id];
            const name = data.name[currentLang] || data.name.en;
            const img = data.mainImage;
            return `<div class="mini-card" data-id="${id}">
                        <img class="mini-img" src="${img}" alt="${name}" loading="lazy">
                        <div class="mini-content">
                            <h3>${name}</h3>
                            <button class="btn mini-detail-btn" data-id="${id}">${UI_TEXT[currentLang].viewDetails}</button>
                        </div>
                    </div>`;
        }).join('');
        container.querySelectorAll('.mini-card').forEach(card => {
            const islandId = card.getAttribute('data-id');
            card.querySelector('.mini-detail-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                renderDetailPage(islandId);
            });
        });
    }

    function attachCardDetailEvents() {
        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                renderDetailPage(id);
            });
        });
    }

    // 詳細ページ
    function renderDetailPage(islandId) {
        const data = islandsData[islandId];
        if (!data) return;
        const ui = UI_TEXT[currentLang];
        const name = data.name[currentLang] || data.name.en;
        const description = data.desc?.[currentLang] || data.desc?.en || "";
        const access = data.access?.[currentLang] || data.access?.en || "";
        const sights = data.sights?.[currentLang] || data.sights?.en || "";
        const tips = data.tips?.[currentLang] || data.tips?.en || "";
        const official = data.officialLink;
        const img = data.mainImage;
        const detailHtml = `
            <div class="detail-container">
                <button class="btn back-btn" id="backToMainBtn">${ui.backToHome}</button>
                <img class="detail-img" src="${img}" alt="${name}">
                <div class="detail-info">
                    <h2>${name}</h2>
                    <div class="info-block"><h3>📖 ${ui.description}</h3><p>${description}</p></div>
                    <div class="info-block"><h3>🚢 ${ui.access}</h3><p>${access}</p></div>
                    <div class="info-block"><h3>✨ ${ui.sights}</h3><p>${sights}</p></div>
                    <div class="info-block"><h3>💡 ${ui.tips}</h3><p>${tips}</p></div>
                    <a href="${official}" target="_blank" class="btn">${ui.officialSite} ↗</a>
                </div>
            </div>
        `;
        document.getElementById('dynamicContent').innerHTML = detailHtml;
        document.getElementById('backToMainBtn').addEventListener('click', () => renderMainPage());
        currentView = `detail:${islandId}`;
    }

    // 初期化
    function initApp() {
        const savedLang = localStorage.getItem('appLang') || 'en';
        const savedTheme = localStorage.getItem('appTheme') || 'dark';
        currentLang = savedLang;
        currentTheme = savedTheme;
        document.getElementById('languageSelect').value = currentLang;
        updateThemeUI();
        renderMainPage();
        document.getElementById('languageSelect').addEventListener('change', (e) => {
            localStorage.setItem('appLang', e.target.value);
            switchLanguage(e.target.value);
        });
        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('appTheme', currentTheme);
            updateThemeUI();
        });
    }
    initApp();

    // Service Worker の登録（オフライン＆アイコン動的生成）
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('SW登録完了', reg)).catch(err => console.log('SWエラー', err));
    }
</script>
</body>
</html>
